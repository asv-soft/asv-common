name: Build and Publish Development Version

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-dev"

env:
  PATH_TO_PROJECTS: ${{ github.workspace }}/src
  PACKAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}/output/
  NUGET_SOURCE_URL: 'https://api.nuget.org/v3/index.json'
  GITHUB_PACKAGES_URL: 'https://nuget.pkg.github.com/asv-soft/index.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 'Deploy'
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          props = ET.parse(Path(os.environ["PATH_TO_PROJECTS"]) / "Directory.Build.props")
          declared = props.findtext(".//ProductVersion")
          if declared != version:
              raise SystemExit(f"Tag version {version!r} does not match ProductVersion {declared!r}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"VERSION={version}\n")
          PYTHON

      - name: Add NuGet source
        env:
          NUGET_USER: ${{ secrets.USER_NAME }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GIHUB_NUGET_AUTH_TOKEN }}
        run: |
          dotnet nuget add source ${{ env.GITHUB_PACKAGES_URL }} --name GitHub --username "$NUGET_USER" --password "$GITHUB_PACKAGES_TOKEN" --store-password-in-clear-text

      - name: Restore dependencies
        run: |
          cd src
          dotnet restore Asv.Common.slnx

      - name: Build projects
        run: |
          cd src
          dotnet build Asv.Common.slnx -c Release --no-restore -p:GeneratePackageOnBuild=false

      - name: Running all tests
        run:  |
          cd src
          dotnet test Asv.Common.slnx -c Release --no-build --no-restore --verbosity normal

      - name: Pack projects to Nuget
        run: |
          cd src
          dotnet pack Asv.Common.slnx -c Release --no-build --no-restore -p:PackageVersion=${{ env.VERSION }} --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }}

      - name: Push packages to Github
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GIHUB_NUGET_AUTH_TOKEN }}
        run: |
          cd src
          dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIRECTORY }}Asv.Cfg.${{ env.VERSION }}.nupkg --skip-duplicate -k "$GITHUB_PACKAGES_TOKEN" -s ${{ env.GITHUB_PACKAGES_URL }}
          dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIRECTORY }}Asv.Common.${{ env.VERSION }}.nupkg --skip-duplicate -k "$GITHUB_PACKAGES_TOKEN" -s ${{ env.GITHUB_PACKAGES_URL }}
          dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIRECTORY }}Asv.IO.${{ env.VERSION }}.nupkg --skip-duplicate -k "$GITHUB_PACKAGES_TOKEN" -s ${{ env.GITHUB_PACKAGES_URL }}
          dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIRECTORY }}Asv.Store.${{ env.VERSION }}.nupkg --skip-duplicate -k "$GITHUB_PACKAGES_TOKEN" -s ${{ env.GITHUB_PACKAGES_URL }}
          dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIRECTORY }}Asv.Modeling.${{ env.VERSION }}.nupkg --skip-duplicate -k "$GITHUB_PACKAGES_TOKEN" -s ${{ env.GITHUB_PACKAGES_URL }}
          dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIRECTORY }}Asv.Composition.${{ env.VERSION }}.nupkg --skip-duplicate -k "$GITHUB_PACKAGES_TOKEN" -s ${{ env.GITHUB_PACKAGES_URL }}
          dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIRECTORY }}Asv.XUnit.${{ env.VERSION }}.nupkg --skip-duplicate -k "$GITHUB_PACKAGES_TOKEN" -s ${{ env.GITHUB_PACKAGES_URL }}
